<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dpaie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <nav aria-label="メニュー">
      <details class="view-menu">
        <summary>表示</summary>
        <div class="view-menu-panel">
          <label for="ui-scale">画面のスケール <output id="ui-scale-value" for="ui-scale">100%</output></label>
          <input id="ui-scale" type="range" min="70" max="150" step="10" value="100">
          <label class="view-check"><input id="show-hidden-folders" type="checkbox" checked> 隠しフォルダを表示</label>
        </div>
      </details>
    </nav>
  </header>
  <main id="workspace" aria-label="ファイルペイン"></main>
  <script src="app.js"></script>
</body>
</html>
